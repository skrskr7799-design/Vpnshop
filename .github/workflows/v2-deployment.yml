name: VPNShop V2 deployment

on:
  push:
    branches: [work/vpnshop-v2]
  pull_request:
    paths:
      - 'ops/**'
      - 'Dockerfile'
      - 'apps/api/src/config/**'
      - 'apps/api/src/modules/admin/admin-app.ts'
      - '.github/workflows/v2-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Render V2 roles and verify preflight isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 ops/scripts/test_v2_compose.py -v
  smoke:
    name: V2 Single and TLS transport smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build local candidates
        run: ops/scripts/build.sh
      - name: Exercise the built TLS edge and gateway
        env:
          MZT_V2_EDGE_IMAGE: mzt-ci-edge:${{ github.sha }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 ops/scripts/v2_tls_smoke.py
      - name: Start the disposable Single deployment and verify local backup
        run: MZT_V2_SMOKE=1 ops/scripts/smoke.sh
