name: VPNShop release rehearsal

on:
  pull_request:
  push:
    branches: ['fix/v2-release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exercise release contracts
        id: contracts
        run: |
          python3 ops/scripts/test_v2_release.py -v
          python3 ops/scripts/test_release_rehearsal.py -v
          python3 ops/scripts/test_release_risk_policy.py -v
      - name: Scan an assembled deploy bundle with the release Gitleaks gate
        id: bundle-scan
        run: |
          python3 ops/scripts/v2_release.py candidate "$RUNNER_TEMP/vpnshop-bundle-candidate"
          python3 ops/scripts/v2_release.py scan-bundle "$RUNNER_TEMP/vpnshop-bundle-candidate/vpnshop-deploy-v0.0.0.tar.gz" \
            --report "$RUNNER_TEMP/mzt-release-scans/bundle-candidate.gitleaks-locations.json"
          python3 ops/scripts/test_release_bundle_scanner.py -v
      - name: Build all seven images from the release worktree
        id: build
        run: |
          umask 077
          python3 ops/scripts/v2_release.py build-candidate
      - name: Exercise migration, CLI recovery, PITR and TLS
        id: runtime
        run: bash ops/scripts/release-runtime-checks.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Enforce the release security gates
        id: scans
        run: ops/scripts/scan-release.sh "$RUNNER_TEMP/mzt-release-scans"
      - name: Record safe stage status
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ format('contracts={0} bundle-scan={1} build={2} runtime={3} scans={4}', steps.contracts.outcome, steps.bundle-scan.outcome, steps.build.outcome, steps.runtime.outcome, steps.scans.outcome) }}
        run: |
          mkdir -p "$RUNNER_TEMP/mzt-release-scans"
          printf 'sha=%s\n%s\n' "$GITHUB_SHA" "$OUTCOMES" > "$RUNNER_TEMP/mzt-release-scans/stages.txt"
      - name: Upload sanitized release diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rehearsal-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mzt-release-scans/stages.txt
            ${{ runner.temp }}/mzt-release-scans/scan-gates.json
            ${{ runner.temp }}/mzt-release-scans/*.gitleaks-locations.json
            ${{ runner.temp }}/mzt-release-scans/*.vulnerabilities.json
            ${{ runner.temp }}/mzt-release-scans/*.risk-policy.json
            ${{ runner.temp }}/mzt-release-scans/npm-production.json
            ${{ runner.temp }}/mzt-release-scans/npm-all.json
          if-no-files-found: error
