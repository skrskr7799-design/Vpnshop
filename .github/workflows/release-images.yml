name: Publish authorized VPNShop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (vX.Y.Z)'
        required: true
        type: string
      previous:
        description: 'Previous attested release version or first-release'
        required: true
        type: string
      notes:
        description: 'Maintainer notes as JSON. See docs/RELEASE_PROCESS.md.'
        required: true
        type: string
      refresh:
        description: 'Rebuild all images from the checked-in inputs, including the pinned system packages'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: vpnshop-release-registry
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'skrskr7799-design/Vpnshop' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: source
    runs-on: ubuntu-24.04
    environment: release-registry
    timeout-minutes: 55
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      PREVIOUS_RELEASE: ${{ inputs.previous }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Isolate the registry credential directory
        run: printf 'DOCKER_CONFIG=%s/vpnshop-registry\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reject a preexisting release or tag
        run: python3 ops/scripts/v2_publish.py check "$RELEASE_VERSION"
      - name: Plan, fetch immutable prior images and build changed targets
        env:
          REFRESH_BASES: ${{ inputs.refresh }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          umask 077
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/vpnshop-notes.json"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          args=()
          if [[ "$REFRESH_BASES" == true ]]; then args+=(--refresh); fi
          python3 ops/scripts/v2_release.py plan "$PREVIOUS_RELEASE" "$RUNNER_TEMP/vpnshop-plan.json" "${args[@]}"
      - name: Test the candidate images and PostgreSQL recovery
        run: |
          MZT_V2_SMOKE=1 MZT_V2_CLI_SMOKE=1 ops/scripts/smoke.sh
          MZT_DRILL_REPO=s3 ops/scripts/pitr.sh
          MZT_V2_EDGE_IMAGE="mzt-ci-edge:$GITHUB_SHA" python3 ops/scripts/v2_tls_smoke.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Enforce existing dependency, image and secret gates
        run: ops/scripts/scan-release.sh "$RUNNER_TEMP/mzt-release-scans"
      - name: Publish verified images and assemble deploy bundle
        run: |
          python3 ops/scripts/v2_release.py finalize "$RUNNER_TEMP/vpnshop-plan.json" "$RELEASE_VERSION" \
            "$RUNNER_TEMP/vpnshop-notes.json" "$RUNNER_TEMP/vpnshop-release"
      - name: Attest the archive and standalone launcher
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ runner.temp }}/vpnshop-release/vpnshop-deploy-*.tar.gz
            ${{ runner.temp }}/vpnshop-release/vpnshop.sh
      - name: Verify provenance and publish immutable release assets
        run: python3 ops/scripts/v2_publish.py publish "$RELEASE_VERSION" "$RUNNER_TEMP/vpnshop-release"
      - name: Discard registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
