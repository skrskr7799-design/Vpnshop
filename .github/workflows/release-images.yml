name: Publish reviewed image candidate
on:
  workflow_dispatch:
    inputs:
      previous_manifest:
        description: 'SHA-256 of the previous compatible manifest, or first-release'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: vpnshop-release-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-registry
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and verify the exact candidate
        run: |
          ops/scripts/build.sh
          ops/scripts/smoke.sh
          MZT_DRILL_REPO=s3 ops/scripts/pitr.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Verify release supply chain before registry publication
        run: ops/scripts/scan-release.sh "$RUNNER_TEMP/mzt-release-scans"
      - name: Publish tested images and emit digest-only manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_MANIFEST: ${{ inputs.previous_manifest }}
        run: ops/scripts/publish.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
