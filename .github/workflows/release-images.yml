name: Publish authorized VPNShop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (vX.Y.Z)'
        required: true
        type: string
      previous:
        description: 'Previous attested release version or first-release'
        required: true
        type: string
      notes:
        description: 'Maintainer notes as JSON. See docs/RELEASE_PROCESS.md.'
        required: true
        type: string
      refresh:
        description: 'Rebuild all images from the checked-in inputs, including the pinned system packages'
        type: boolean
        default: false
      resume:
        description: 'Resume an unpublished tag/draft only if its commit and any existing files match'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: vpnshop-release-registry
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'skrskr7799-design/Vpnshop' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: source
    runs-on: ubuntu-24.04
    environment: release-registry
    timeout-minutes: 55
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      PREVIOUS_RELEASE: ${{ inputs.previous }}
      RESUME_RELEASE: ${{ inputs.resume }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Isolate the registry credential directory
        run: printf 'DOCKER_CONFIG=%s/vpnshop-registry\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reject a preexisting release or tag
        id: precheck
        run: |
          args=()
          if [[ "$RESUME_RELEASE" == true ]]; then args+=(--resume); fi
          python3 ops/scripts/v2_publish.py check "$RELEASE_VERSION" "${args[@]}"
      - name: Plan, fetch immutable prior images and build changed targets
        id: plan
        env:
          REFRESH_BASES: ${{ inputs.refresh }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          umask 077
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/vpnshop-notes.json"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          args=()
          if [[ "$REFRESH_BASES" == true ]]; then args+=(--refresh); fi
          python3 ops/scripts/v2_release.py plan "$PREVIOUS_RELEASE" "$RUNNER_TEMP/vpnshop-plan.json" "${args[@]}"
      - name: Test the candidate images and PostgreSQL recovery
        id: runtime
        run: bash ops/scripts/release-runtime-checks.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Enforce existing dependency, image and secret gates
        id: scans
        run: ops/scripts/scan-release.sh "$RUNNER_TEMP/mzt-release-scans"
      - name: Publish verified images and assemble deploy bundle
        id: bundle
        run: |
          python3 ops/scripts/release_risk_policy.py verify-publication-window "$RUNNER_TEMP/mzt-release-scans/scan-gates.json"
          python3 ops/scripts/v2_release.py finalize "$RUNNER_TEMP/vpnshop-plan.json" "$RELEASE_VERSION" \
            "$RUNNER_TEMP/vpnshop-notes.json" "$RUNNER_TEMP/vpnshop-release" \
            --scan-report "$RUNNER_TEMP/mzt-release-scans/bundle-preview.gitleaks-locations.json"
      - name: Attest the archive and standalone launcher
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            ${{ runner.temp }}/vpnshop-release/vpnshop-deploy-*.tar.gz
            ${{ runner.temp }}/vpnshop-release/vpnshop.sh
      - name: Verify provenance and publish immutable release assets
        id: publish
        run: |
          python3 ops/scripts/release_risk_policy.py verify-publication-window "$RUNNER_TEMP/mzt-release-scans/scan-gates.json"
          args=()
          if [[ "$RESUME_RELEASE" == true ]]; then args+=(--resume); fi
          python3 ops/scripts/v2_publish.py publish "$RELEASE_VERSION" "$RUNNER_TEMP/vpnshop-release" "${args[@]}" \
            --scan-report "$RUNNER_TEMP/mzt-release-scans/bundle-final.gitleaks-locations.json"
      - name: Record safe release failure status
        if: ${{ failure() }}
        env:
          OUTCOMES: ${{ format('precheck={0} plan={1} runtime={2} scans={3} bundle={4} attest={5} publish={6}', steps.precheck.outcome, steps.plan.outcome, steps.runtime.outcome, steps.scans.outcome, steps.bundle.outcome, steps.attest.outcome, steps.publish.outcome) }}
        run: |
          mkdir -p "$RUNNER_TEMP/mzt-release-scans"
          printf 'sha=%s\n%s\n' "$GITHUB_SHA" "$OUTCOMES" > "$RUNNER_TEMP/mzt-release-scans/stages.txt"
      - name: Upload sanitized release diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mzt-release-scans/stages.txt
            ${{ runner.temp }}/mzt-release-scans/scan-gates.json
            ${{ runner.temp }}/mzt-release-scans/*.gitleaks-locations.json
            ${{ runner.temp }}/mzt-release-scans/*.vulnerabilities.json
            ${{ runner.temp }}/mzt-release-scans/*.risk-policy.json
            ${{ runner.temp }}/mzt-release-scans/npm-production.json
            ${{ runner.temp }}/mzt-release-scans/npm-all.json
          if-no-files-found: warn
      - name: Discard registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
