server {
    listen 8080;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
