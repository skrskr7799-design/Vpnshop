server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 8443 ssl;
    server_name ${EDGE_HOST};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/edge_cert;
    ssl_certificate_key /run/secrets/edge_key;
    ssl_session_tickets off;
    if ($http_host = "") { return 421; }
    if ($host != ${EDGE_HOST}) { return 421; }
    if ($ssl_server_name != ${EDGE_HOST}) { return 421; }
    include /tmp/mzt-acl.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src ${EDGE_BROWSER_PWA}; worker-src ${EDGE_BROWSER_PWA}; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 20s;
    proxy_intercept_errors off;
    error_page 502 504 =503 @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE"}}';
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app ${EDGE_UPSTREAM_SCHEME}://${EDGE_APP};
    include /tmp/mzt-upstream.conf;
    set $static ${EDGE_STATIC};
    proxy_set_header Host ${EDGE_HOST_HEADER};
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-MZT-Edge-Client-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    location = /api/metrics { return 404; }
    location = /metrics { return 404; }
    include /tmp/mzt-routes.conf;
    location / { proxy_pass http://$static$request_uri; }
}
