# Invalid geo inputs map to 255.255.255.255, and do not reach the application.
geo $http_x_mzt_edge_client_ip $valid_edge_client {
    default 0;
    0.0.0.0/1 1;
    128.0.0.0/1 1;
    255.255.255.254/31 0;
    ::/1 1;
    8000::/1 1;
}
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 8443 ssl;
    server_name ${EDGE_HOST};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/secrets/edge_cert;
    ssl_certificate_key /run/secrets/edge_key;
    ssl_client_certificate /run/secrets/core_gw_client_ca;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_tickets off;
    if ($host != ${EDGE_HOST}) { return 421; }
    if ($ssl_server_name != ${EDGE_HOST}) { return 421; }
    if ($valid_edge_client = 0) { return 400; }
    allow ${EDGE_GATEWAY_PEER};
    deny all;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 20s;
    error_page 502 504 =503 @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE"}}';
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://public-api:3000;
    proxy_set_header Host ${EDGE_PUBLIC_HOST};
    proxy_set_header X-Forwarded-Host ${EDGE_PUBLIC_HOST};
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_x_mzt_edge_client_ip;
    proxy_set_header X-Real-IP $http_x_mzt_edge_client_ip;
    proxy_set_header X-MZT-Edge-Client-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    include /etc/nginx/public-routes.conf;
    location / { return 404; }
}
