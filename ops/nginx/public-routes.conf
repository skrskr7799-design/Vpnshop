# The public storefront and gateway share the same public API surface.
location ~ ^/webhooks/platega/[^/]+$ {
    client_max_body_size 16k;
    proxy_pass $app$request_uri;
}
location ~ ^/api/(health|ready|config|plans|orders|me/(subscription|support)|auth/(register|verify-email|resend-verification|email|login|password/change-temporary|refresh|logout|forgot-password|reset-password|sessions|me|oauth))(/|$) {
    proxy_cache off;
    proxy_pass $app$request_uri;
}
location /api/ { return 404; }
location /webhooks/ { return 404; }
