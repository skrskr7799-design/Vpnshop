[vpnshop]
pg1-path=/state/db/pgdata
pg1-socket-path=/var/run/postgresql

[global]
repo1-type=s3
repo1-path=/vpnshop/cluster-a/key-v1
repo1-s3-bucket=REPLACE_WITH_BUCKET
repo1-s3-endpoint=REPLACE_WITH_STORAGE_HOST
repo1-s3-region=REPLACE_WITH_REGION
repo1-s3-key=REPLACE_IN_SECRET_MOUNT
repo1-s3-key-secret=REPLACE_IN_SECRET_MOUNT
repo1-s3-uri-style=path
repo1-storage-verify-tls=y
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_IN_SECRET_MOUNT
repo1-retention-full=5
repo1-retention-diff=14
repo1-retention-archive-type=full
archive-async=n
archive-timeout=120
start-fast=y
lock-path=/tmp/pgbackrest
log-level-console=warn
log-level-file=off
