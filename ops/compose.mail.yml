# Enable only after the host firewall restricts this bridge to the approved SMTP relay.
services:
  public-api:
    environment: {MAIL_TRANSPORT_ENABLED: "true"}
  admin-api:
    environment: {MAIL_TRANSPORT_ENABLED: "true", MAIL_QUEUE_KEY_FILE: /run/secrets/mail_key}
    secrets: [mail_key]
  notifications:
    environment:
      MAIL_FROM: ${MAIL_FROM:?Set the verified SMTP sender address}
    networks:
      smtp-egress:

networks:
  smtp-egress:
    driver: bridge
