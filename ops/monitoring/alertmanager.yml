route:
  receiver: local-sink
  group_by: [alertname, group, severity]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      group_wait: 5s
      repeat_interval: 30m
inhibit_rules:
  - source_matchers: ['alertname="PostgresUnavailable"']
    target_matchers: ['group=~"api|fulfillment|payment"']
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [group]
receivers:
  - name: local-sink
    webhook_configs:
      - url: http://alert-sink:9180/alerts
        send_resolved: true
