global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    product: mzt
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: public-api
    static_configs: [{targets: ['172.30.76.10:9100']}]
  - job_name: admin-api
    static_configs: [{targets: ['172.30.77.11:9100']}]
  - job_name: postgres-operations
    static_configs: [{targets: ['172.30.75.12:9100']}]
