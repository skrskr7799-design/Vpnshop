# Use --env-file with a deployment manifest's image refs and nonsecret settings.
x-hardened: &hardened
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}
x-node: &node
  <<: *hardened
  image: ${APPLICATION_IMAGE:?Set application image digest}
  user: "1000:1000"
  mem_limit: 512m
  cpus: 0.75
  stop_grace_period: 30s
x-edge-env: &edge-env
  EDGE_APP: public-api:3000
  EDGE_STATIC: web:8080

services:
  db:
    <<: *hardened
    image: ${DATABASE_IMAGE:?Set database image digest}
    user: "999:999"
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 120s
    command: ["postgres","-c","password_encryption=scram-sha-256","-c","max_connections=60","-c","log_statement=none","-c","log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: vpnshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust --data-checksums"
    secrets: [db_superuser, db_migrator, db_public, db_admin, db_worker, db_billing, db_notifications, db_backup, db_monitor]
    volumes: [pgdata:/state/db]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec", "/var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777"]
    networks:
      public-db: {aliases: [pg-public]}
      admin-db: {aliases: [pg-admin]}
      tasks-db: {aliases: [pg-worker]}
      finance-db: {aliases: [pg-billing]}
      notifications-db: {aliases: [pg-notifications]}
      monitoring-db: {aliases: [pg-monitor]}
      backup-db: {aliases: [pg-backup]}
      migration-db: {aliases: [pg-migrate]}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -h 127.0.0.1 -d vpnshop"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrator:
    <<: *hardened
    image: ${MIGRATOR_IMAGE:?Set migrator image digest}
    user: "1000:1000"
    restart: "no"
    profiles: [migration]
    depends_on: {db: {condition: service_healthy}}
    environment: {HOME: /tmp, DATABASE_URL_FILE: /run/secrets/migrator_url}
    secrets: [migrator_url]
    networks: [migration-db]
  public-api:
    <<: *node
    depends_on: {db: {condition: service_healthy}}
    environment:
      MZT_PROCESS: public
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set public HTTPS origin}
      WEB_TRUSTED_PROXIES: 172.30.72.2
      DATABASE_URL_FILE: /run/secrets/public_url
      JWT_SECRET_FILE: /run/secrets/web_jwt
      COOKIE_SECRET_FILE: /run/secrets/web_cookie
      MAIL_QUEUE_KEY_FILE: /run/secrets/mail_key
      RELEASE_ID: ${APPLICATION_IMAGE}
    secrets: [public_url, web_jwt, web_cookie, mail_key]
    networks: [public-api-edge, public-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  admin-api:
    <<: *node
    command: [node, dist/admin.js]
    depends_on: {db: {condition: service_healthy}}
    environment:
      MZT_PROCESS: admin
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      ADMIN_ENABLED: "true"
      ADMIN_HOST: 0.0.0.0
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set administrative HTTPS origin}
      ADMIN_TRUSTED_PROXIES: 172.30.73.2
      ADMIN_ALLOWED_CIDRS: ${ADMIN_CLIENT_CIDRS:?Set administrative CIDRs}
      DATABASE_URL_FILE: /run/secrets/admin_url
      ADMIN_ENCRYPTION_KEY_FILE: /run/secrets/admin_key
      RELEASE_ID: ${APPLICATION_IMAGE}
    secrets: [admin_url, admin_key]
    networks: [admin-api-edge, admin-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  worker:
    <<: *node
    command: [node, dist/worker.js]
    depends_on: {db: {condition: service_healthy}}
    stop_grace_period: 60s
    environment: {MZT_PROCESS: worker, DATABASE_URL_FILE: /run/secrets/worker_url, RELEASE_ID: "${APPLICATION_IMAGE}"}
    secrets: [worker_url]
    networks: [tasks-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  billing:
    <<: *node
    command: [node, dist/billing.js]
    depends_on: {db: {condition: service_healthy}}
    environment: {MZT_PROCESS: billing, BILLING_MODE: disabled, DATABASE_URL_FILE: /run/secrets/billing_url, RELEASE_ID: "${APPLICATION_IMAGE}"}
    secrets: [billing_url]
    networks: [finance-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  notifications:
    <<: *node
    command: [node, dist/notifications.js]
    depends_on: {db: {condition: service_healthy}}
    environment: {MZT_PROCESS: notifications, DATABASE_URL_FILE: /run/secrets/notifications_url, SMTP_URL_FILE: /run/secrets/smtp_url, MAIL_QUEUE_KEY_FILE: /run/secrets/mail_key, RELEASE_ID: "${APPLICATION_IMAGE}"}
    secrets: [notifications_url, smtp_url, mail_key]
    networks: [notifications-db]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3004/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    <<: *hardened
    image: ${WEB_IMAGE:?Set web image digest}
    networks: [public-assets]
    mem_limit: 64m
  admin:
    <<: *hardened
    image: ${ADMIN_IMAGE:?Set admin image digest}
    networks: [admin-assets]
    mem_limit: 64m
  public-edge:
    <<: *hardened
    image: ${EDGE_IMAGE:?Set edge image digest}
    environment: {<<: *edge-env, EDGE_HOST: "${PUBLIC_HOST:?Set public hostname}"}
    secrets: [{source: public_cert, target: edge_cert}, {source: public_key, target: edge_key}]
    ports: [{target: 8443, published: "${PUBLIC_TLS_PORT:-443}", host_ip: "${PUBLIC_BIND_IP:-127.0.0.1}"}]
    networks:
      public-ingress:
      public-assets:
      public-api-edge: {ipv4_address: 172.30.72.2}
    mem_limit: 128m
  admin-edge:
    <<: *hardened
    image: ${EDGE_IMAGE}
    environment: {EDGE_APP: "admin-api:3001", EDGE_STATIC: "admin:8080", EDGE_HOST: "${ADMIN_HOSTNAME:?Set admin hostname}", EDGE_ADMIN_CIDRS: "${ADMIN_CLIENT_CIDRS}"}
    secrets: [{source: admin_cert, target: edge_cert}, {source: admin_tls_key, target: edge_key}]
    ports: [{target: 8443, published: "${ADMIN_TLS_PORT:-443}", host_ip: "${ADMIN_BIND_IP:?Set private management address}"}]
    networks:
      admin-ingress:
      admin-assets:
      admin-api-edge: {ipv4_address: 172.30.73.2}
    mem_limit: 128m

networks:
  public-ingress:
  admin-ingress:
    ipam: {config: [{subnet: 172.30.74.0/28}]}
  public-assets: {internal: true}
  admin-assets: {internal: true}
  public-api-edge:
    internal: true
    ipam: {config: [{subnet: 172.30.72.0/28}]}
  admin-api-edge:
    internal: true
    ipam: {config: [{subnet: 172.30.73.0/28}]}
  public-db: {internal: true}
  admin-db: {internal: true}
  tasks-db: {internal: true}
  finance-db: {internal: true}
  notifications-db: {internal: true}
  monitoring-db: {internal: true}
  backup-db: {internal: true}
  migration-db: {internal: true}

volumes:
  pgdata:

secrets:
  db_superuser: {file: "${SECRETS_DIR:?Set secrets directory}/db_superuser"}
  db_migrator: {file: "${SECRETS_DIR}/db_migrator"}
  db_public: {file: "${SECRETS_DIR}/db_public"}
  db_admin: {file: "${SECRETS_DIR}/db_admin"}
  db_worker: {file: "${SECRETS_DIR}/db_worker"}
  db_billing: {file: "${SECRETS_DIR}/db_billing"}
  db_notifications: {file: "${SECRETS_DIR}/db_notifications"}
  db_backup: {file: "${SECRETS_DIR}/db_backup"}
  db_monitor: {file: "${SECRETS_DIR}/db_monitor"}
  migrator_url: {file: "${SECRETS_DIR}/migrator_url"}
  public_url: {file: "${SECRETS_DIR}/public_url"}
  admin_url: {file: "${SECRETS_DIR}/admin_url"}
  worker_url: {file: "${SECRETS_DIR}/worker_url"}
  billing_url: {file: "${SECRETS_DIR}/billing_url"}
  notifications_url: {file: "${SECRETS_DIR}/notifications_url"}
  smtp_url: {file: "${SECRETS_DIR}/smtp_url"}
  web_jwt: {file: "${SECRETS_DIR}/web_jwt"}
  web_cookie: {file: "${SECRETS_DIR}/web_cookie"}
  mail_key: {file: "${SECRETS_DIR}/mail_key"}
  admin_key: {file: "${SECRETS_DIR}/admin_key"}
  public_cert: {file: "${SECRETS_DIR}/public_cert"}
  public_key: {file: "${SECRETS_DIR}/public_key"}
  admin_cert: {file: "${SECRETS_DIR}/admin_cert"}
  admin_tls_key: {file: "${SECRETS_DIR}/admin_tls_key"}
